[package]
name = "enensu"
version = "0.3.0"
edition = "2024"
default-run = "enensu"
license = "GPL-3.0-only"
description = "Patch optional kernel modules into Android first-stage boot ramdisks"

[dependencies]
# Same image parser and repacker as KernelSU v3.3.1 (userspace/ksud/Cargo.toml).
android-bootimg = { git = "https://github.com/5ec1cff/android_bootimg", rev = "150425b027c76ea104c82e408571651f2181b2c2" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpio = "0.4.2"
object = { version = "0.41", default-features = false, features = ["std", "read_core", "elf", "unaligned"] }
tempfile = "3"
tinyfiledialogs = "3.9.1"

[dev-dependencies]
flate2 = "1"
object = { version = "0.41", default-features = false, features = ["write_std", "elf"] }

[features]
desktop = ["dep:tao", "dep:wry", "dep:serde_json", "dep:zip", "dep:dirs", "dep:embed-resource"]

[target.'cfg(windows)'.dependencies]
tao = { version = "0.37", optional = true }
wry = { version = "0.57", default-features = false, features = ["os-webview"], optional = true }
serde_json = { version = "1", optional = true }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
dirs = { version = "6", optional = true }

[[bin]]
name = "enenSU-Desktop"
path = "src/desktop/main.rs"
required-features = ["desktop"]

[build-dependencies]
embed-resource = { version = "3", optional = true }
